<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
<link rel="stylesheet" href="index.css">
<link rel="icon" type="image/png" href="Icon.jpeg">
</head>
<body>
<div class="login-card">
    <h2>Welcome 💗</h2>
   <form id="loginForm">
    <input
        type="text"
        id="username"
        placeholder="Username">
    <input
        type="password"
        id="password"
        placeholder="Password">
    <p id="errorMessage"></p>
    <button type="submit">
        Login
    </button>
</form>

    <p id="message"></p>

</div>

    <script src="index.js"></script>
</body>
</html>
